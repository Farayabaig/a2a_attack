version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: securebank-postgres
    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: securebank_user
      POSTGRES_PASSWORD: securebank_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebank_user -d securebank"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

